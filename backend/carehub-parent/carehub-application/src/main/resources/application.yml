server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: carehub
        format_sql: true
    show-sql: true

springdoc:
  packagesToScan: it.carehub.auth.api,it.carehub.user.api,it.carehub.availability.api,it.carehub.appointment.api.controller,it.carehub.report.api.controller

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace

security:
  jwt:
    # 32-byte ASCII (Base64) => meets HS256 requirements
    secret: MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY=
    access-ttl-seconds: 3600
