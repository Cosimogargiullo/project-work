spring.application.name=carehub-application

# Datasource configured via environment variables (set these on Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carehub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA / Hibernate defaults (modify as needed)
spring.jpa.hibernate.ddl-auto=update

# Port can be overridden by the platform
server.port=${PORT:8080}
